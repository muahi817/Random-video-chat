<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Call With Girls - Free Random Video Chat No Sign Up</title>
<meta name="description" content="Free video call with girls online. Talk to strangers with random video chat. No signup, 100% free.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; font-family:Arial; background: linear-gradient(180deg, #EEC489, #EC4899 100%); color:white; text-align:center; padding:20px; }
.logo { font-size:40px; font-weight:bold; margin-bottom:5px; }
h1 { font-size:30px; margin:0; }
h2 { font-size:16px; font-weight:normal; opacity:0.9; margin-bottom:30px; }
#startBtn { background:black; color:white; padding:18px 40px; font-size:20px; border:none; border-radius:15px; cursor:pointer; margin-top:20px; }
#videoBox { display:none; background:rgba(0,0,0,0.3); padding:20px; border-radius:15px; margin:20px auto; max-width:800px; }
video { width:48%; border-radius:10px; background:black; margin:5px; }
#friendId { padding:10px; width:60%; border-radius:5px; border:none; margin:10px 0; }
.btn { padding:10px 20px; background:yellow; color:black; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
#supportBox { display:none; background:#FFF457; color:black; padding:15px; border-radius:10px; margin-top:15px; }
</style>
</head>
<body>

<div class="logo">Omegloo</div>
<h1>Video Call With Girls</h1>
<h2>Free Random Video Chat - No Sign Up</h2>

<button id="startBtn" onclick="startChat()">START CHATTING</button>

<div id="videoBox">
<h3>Aapki ID: <span id="myid" style="color:yellow;"></span></h3>
<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>
<br>
<input id="friendId" placeholder="Dost ki ID yahan paste kare">
<button class="btn" onclick="callFriend()">Call Kare</button>
</div>

<div id="supportBox">
<h3>Call pasand aayi? Support karein ❤️</h3>
<button class="btn" onclick="showNumber()">Easypaisa Number Dekho</button>
<p id="numberBox" style="display:none; font-size:18px; font-weight:bold;">03466145410</p>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
var peer, localStream;

function showNumber() {
document.getElementById('numberBox').style.display = 'block';
}

function startChat() {
document.getElementById('startBtn').style.display = 'none';
document.getElementById('videoBox').style.display = 'block';
document.getElementById('supportBox').style.display = 'block';

peer = new Peer();
peer.on('open', function(id) {
document.getElementById('myid').innerText = id;
});

navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(function(stream){
localStream = stream;
document.getElementById('localVideo').srcObject = stream;
});

peer.on('call', function(call) {
call.answer(localStream);
call.on('stream', function(remoteStream) {
document.getElementById('remoteVideo').srcObject = remoteStream;
});
});
}

function callFriend() {
var friendId = document.getElementById('friendId').value;
var call = peer.call(friendId, localStream);
call.on('stream', function(remoteStream) {
document.getElementById('remoteVideo').srcObject = remoteStream;
});
}
</script>
</body>
</html>
